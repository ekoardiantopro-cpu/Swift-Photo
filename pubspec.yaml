name: swift_photo
description: Kamera dokumentasi dengan watermark dan penyimpanan lokal.
publish_to: none
version: 0.2.2+4
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  camera: ^0.12.1
  gal: ^2.3.3
  geolocator: ^14.1.2
  geocoding: ^5.0.0
  image_picker: ^1.2.4
  path_provider: ^2.1.5
  google_sign_in: ^7.2.0
  http: ^1.6.0
  workmanager: ^0.10.10
  sqflite: ^2.4.5
  google_sign_in_platform_interface: ^3.1.0
  package_info_plus: ^10.2.2
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/branding/swift_photo.png
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
